<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="クロツグミ">
  <!-- クロツグミ（日本の夏鳥）のオス：黒い頭とせなか・白いおなかに黒い点・黄色いくちばしと目のまわり -->
  <!-- とまり木 -->
  <rect x="8" y="86" width="84" height="6" rx="3" fill="#8a6a4a"/>
  <!-- しっぽ -->
  <path d="M22 62 L4 74 L8 78 L28 70 Z" fill="#1f1f24"/>
  <!-- からだ（黒） -->
  <ellipse cx="44" cy="60" rx="26" ry="20" fill="#24242b"/>
  <!-- おなか（白）と黒い点 -->
  <path d="M44 62 Q48 82 64 76 Q74 70 70 56 Q62 50 52 54 Z" fill="#f7f6f2"/>
  <g fill="#24242b">
    <ellipse cx="56" cy="62" rx="2.2" ry="1.6"/>
    <ellipse cx="63" cy="60" rx="2" ry="1.5"/>
    <ellipse cx="52" cy="69" rx="2" ry="1.5"/>
    <ellipse cx="60" cy="68" rx="2.2" ry="1.6"/>
    <ellipse cx="67" cy="66" rx="1.8" ry="1.4"/>
    <ellipse cx="57" cy="75" rx="1.8" ry="1.3"/>
  </g>
  <!-- つばさ -->
  <path d="M26 54 Q40 46 52 58 Q40 70 26 64 Z" fill="#17171c"/>
  <path d="M30 58 Q40 56 47 60" stroke="#3a3a44" stroke-width="1.5" fill="none"/>
  <!-- あたま（黒） -->
  <circle cx="66" cy="38" r="15" fill="#24242b"/>
  <!-- くちばし（黄色・歌っているので少し開く） -->
  <path d="M79 35 L94 31 L80 39 Z" fill="#f2b632"/>
  <path d="M79 40 L92 41 L80 43 Z" fill="#e39a1f"/>
  <!-- 目と黄色い目のまわり -->
  <circle cx="70" cy="35" r="5" fill="#f2c94c"/>
  <circle cx="70" cy="35" r="3" fill="#0d0d10"/>
  <circle cx="71.2" cy="33.8" r="1" fill="#ffffff"/>
  <!-- あし -->
  <path d="M42 78 L40 87 M52 79 L52 87" stroke="#e8a07a" stroke-width="3" stroke-linecap="round"/>
  <!-- 音符 -->
  <g fill="#9b3fa8">
    <circle cx="86" cy="18" r="3.2"/>
    <rect x="88.4" y="5" width="1.8" height="13"/>
    <path d="M90.2 5 Q96 7 95 12 Q93 9 90.2 9 Z"/>
  </g>
</svg>
